<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Web Steganography Tool</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="container">
    <h1>Web Steganography Tool</h1>

    <!-- Tabs for Images / Audio / Video -->
    <div class="tabs">
        <button class="tab-btn active" data-target="image">Image</button>
        <button class="tab-btn" data-target="audio">Audio</button>
        <button class="tab-btn" data-target="video">Video</button>
    </div>

    <!-- Image Section -->
    <div class="tab-content" id="image">
        <h2>Image Encoder/Decoder</h2>
        <div class="drop-area" id="imageDrop">Drag & Drop Image Here</div>
        <button class="browse-btn" onclick="document.getElementById('imageFile').click()">Browse from Computer</button>
        <input type="file" id="imageFile" style="display:none;" accept=".png,.bmp">
        <div class="preview" id="imagePreview"></div>
        <textarea id="imageMessage" placeholder="Enter secret message"></textarea>
        <input type="password" id="imagePassword" placeholder="Optional password">
        <button id="imageEncodeBtn">Encode</button>
        <button id="imageDecodeBtn">Decode</button>
        <p id="imageResult"></p>
    </div>

    <!-- Audio Section -->
    <div class="tab-content" id="audio" style="display:none;">
        <h2>Audio Encoder/Decoder</h2>
        <div class="drop-area" id="audioDrop">Drag & Drop Audio Here</div>
        <button class="browse-btn" onclick="document.getElementById('audioFile').click()">Browse from Computer</button>
        <input type="file" id="audioFile" style="display:none;" accept=".wav">
        <audio controls id="audioPreview"></audio>
        <textarea id="audioMessage" placeholder="Enter secret message"></textarea>
        <input type="password" id="audioPassword" placeholder="Optional password">
        <button id="audioEncodeBtn">Encode</button>
        <button id="audioDecodeBtn">Decode</button>
        <p id="audioResult"></p>
    </div>

    <!-- Video Section -->
    <div class="tab-content" id="video" style="display:none;">
        <h2>Video Encrypter/Decrypter</h2>
        <div class="drop-area" id="videoDrop">Drag & Drop Video Here</div>
        <button class="browse-btn" onclick="document.getElementById('videoFile').click()">Browse from Computer</button>
        <input type="file" id="videoFile" style="display:none;" accept=".avi,.mp4,.mov">
        <div class="preview" id="videoPreview"></div>

        <!-- User password for decryption -->
        <input type="password" id="videoPassword" placeholder="Enter password for decryption">

        <!-- Generated password after encryption -->
        <div style="display:flex; align-items:center; gap:10px;">
            <input type="text" id="videoPasswordResult" placeholder="Generated password will appear here" readonly>
            <button type="button" id="toggleVideoPassword">Show</button>
        </div>

        <button id="videoEncodeBtn">Encrypt</button>
        <button id="videoDecodeBtn">Decrypt</button>
        <p id="videoResult"></p>
    </div>

    <div class="progress-container">
        <div class="progress-bar" id="progressBar"></div>
    </div>
</div>

<script src="{{ url_for('static', filename='script.js') }}"></script>

<script>
// --- Show/Hide toggle for generated video password ---
const toggleVideoPasswordBtn = document.getElementById('toggleVideoPassword');
const videoPasswordResult = document.getElementById('videoPasswordResult');

toggleVideoPasswordBtn.addEventListener('click', () => {
    if (videoPasswordResult.type === 'password') {
        videoPasswordResult.type = 'text';
        toggleVideoPasswordBtn.innerText = 'Hide';
    } else {
        videoPasswordResult.type = 'password';
        toggleVideoPasswordBtn.innerText = 'Show';
    }
});
</script>

</body>
</html>
